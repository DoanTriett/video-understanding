version: '3.8'

services:
  # Redis: dùng làm job queue (Celery) và cache
  redis:
    image: redis:7-alpine        # dùng bản nhẹ (alpine)
    ports:
      - "6379:6379"              # máy_bạn:trong_container
    volumes:
      - redis_data:/data         # lưu data kể cả khi restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Qdrant: vector database để lưu embeddings
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"              # REST API
      - "6334:6334"              # gRPC (dùng sau)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vu
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: videodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  minio_data:
