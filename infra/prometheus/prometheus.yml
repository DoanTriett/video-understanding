global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Uncomment if the worker exposes a Prometheus metrics endpoint (e.g. via
  # celery-prometheus-exporter or a custom /metrics server on port 9090):
  # - job_name: worker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["worker:9090"]
