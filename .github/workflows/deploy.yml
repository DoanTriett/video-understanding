# Phase 7.4 — Deploy to Kubernetes via Helm.
#
# PREREQUISITES:
#   1. A GitHub environment named "production" must exist in the repo settings
#      (Settings → Environments → New environment). Add required reviewers there
#      to enforce a manual approval gate before deploy runs.
#   2. The secret KUBECONFIG must be set on the "production" environment
#      (base64-encoded kubeconfig file). Without it the kubectl/helm steps will
#      fail — the workflow YAML is valid but the deploy job will error at the
#      kubeconfig-setup step.
#   3. Images for the target tag must already be pushed to GHCR (by build.yml).
#
# Trigger: push a semver tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0

name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production  # manual approval gate configured in repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Set up kubeconfig
        # Requires the KUBECONFIG secret to be set on the "production" environment.
        # Value must be a base64-encoded kubeconfig file.
        # Example: base64 -w0 ~/.kube/config | gh secret set KUBECONFIG --env production
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy via Helm
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          helm upgrade --install video-understanding deploy/helm/video-understanding/ \
            --set api.image.tag=$IMAGE_TAG \
            --set worker.image.tag=$IMAGE_TAG \
            --set frontend.image.tag=$IMAGE_TAG \
            --wait \
            --timeout 5m
