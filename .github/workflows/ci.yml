# Phase 7.1 — lint, unit/contract tests (+ coverage), integration tests, frontend build.
# No MinIO, no Ollama. Summarizer integration excluded via requires_ollama marker.

name: CI

on:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: ruff check
        run: ruff check backend/

      - name: ruff format
        run: ruff format --check backend/

      - name: mypy
        run: mypy backend/

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vu
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: videodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vu -d videodb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'cat /dev/null > /dev/tcp/localhost/6333' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://vu:123@localhost:5432/videodb
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Unit and contract tests (coverage)
        working-directory: backend
        run: >
          pytest tests/ -m "not integration"
          --cov=app --cov-report=term-missing -q

      - name: Cache bge-small-en-v1.5 (Hugging Face)
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: bge-small-en-v1.5-${{ hashFiles('backend/requirements.txt') }}

      - name: Pre-download embedding model for semantic_cache integration
        working-directory: backend
        run: >
          python -c "from sentence_transformers import SentenceTransformer;
          SentenceTransformer('BAAI/bge-small-en-v1.5')"

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Integration tests
        working-directory: backend
        run: >
          pytest tests/ -m "integration and not requires_ollama" -v

  frontend:
    name: frontend
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # package.json has "build" — verified in frontend/package.json scripts
      - name: npm run build
        working-directory: frontend
        run: npm run build

      # package.json has no "test" script — skip npm test intentionally

      - name: npm run lint
        working-directory: frontend
        run: npm run lint
