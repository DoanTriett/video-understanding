apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-understanding.fullname" . }}-worker
  labels:
    {{- include "video-understanding.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.enabled }}
      nodeSelector:
        nvidia.com/gpu: "true"
      {{- end }}
      containers:
        - name: worker
          image: {{ include "video-understanding.image" (dict "Values" .Values "name" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "video-understanding.fullname" . }}-config
            - secretRef:
                name: {{ include "video-understanding.fullname" . }}-secret
          {{- if .Values.gpu.enabled }}
          resources:
            limits:
              nvidia.com/gpu: "1"
          {{- end }}
