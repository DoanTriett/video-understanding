[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require real DB and OpenAI (deselect with -m 'not integration')",
    "requires_openai: integration tests that need the OpenAI API (excluded from CI)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
